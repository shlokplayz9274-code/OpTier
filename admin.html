<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>

  <style>
    body {
      background:#0a0a0a;
      color:white;
      font-family:Arial;
      text-align:center;
    }

    input, select {
      margin:5px;
      padding:8px;
      background:#111;
      border:1px solid #333;
      color:white;
    }

    button {
      padding:8px 12px;
      margin:5px;
      cursor:pointer;
      background:#1a1a1a;
      border:1px solid #333;
      color:white;
    }

    button:hover { background:#222; }

    #list p {
      cursor:pointer;
      padding:4px;
    }

    #list p:hover {
      color:#00ff99;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>Admin Login</h2>
  <input id="email" type="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="Password"><br>
  <button id="loginBtn">Login</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" style="display:none;">

<h2>Admin Panel</h2>

<button id="logoutBtn">Logout</button>

<hr>

<input id="name" placeholder="Player Name"><br>

<!-- MODE DROPDOWN -->
<select id="mode"></select><br>

<input id="points" type="number" placeholder="Points"><br>
<input id="region" placeholder="Region (AS/EU/NA)"><br>

<button id="saveBtn">Save / Update</button>
<button id="deleteBtn">Delete Player</button>

<button id="deleteModeBtn" style="background:#ff4444;">
  Delete Mode
</button>

<hr>

<button id="newSeasonBtn" style="background:#ffcc00;color:black;">
  Start New Season
</button>

<hr>

<h3>Players List</h3>
<div id="list"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  deleteDoc,
  collection,
  onSnapshot,
  getDocs,
  updateDoc,
  deleteField
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyAzKYVQWthAci583dZqkXi2zm3JHNNMeqk",
  authDomain: "mc-tiers-ranking.firebaseapp.com",
  projectId: "mc-tiers-ranking",
  storageBucket: "mc-tiers-ranking.firebasestorage.app",
  messagingSenderId: "909650175085",
  appId: "1:909650175085:web:0fb576c2b8277a58b64b64",
  measurementId: "G-FN7248NLYR"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* ✅ MODES (MATCH INDEX.HTML) */
const modes = [
  "overall",
  "uhc",
  "pot",
  "vanilla",
  "nethop",
  "smp",
  "sword",
  "axe",
  "mace",
];

/* LOAD MODES INTO DROPDOWN */
const modeSelect = document.getElementById("mode");

modes.forEach(m=>{
  let opt = document.createElement("option");
  opt.value = m;
  opt.innerText = m.toUpperCase();
  modeSelect.appendChild(opt);
});

/* LOGIN */
document.getElementById("loginBtn").onclick = async () => {
  try {
    await signInWithEmailAndPassword(
      auth,
      document.getElementById("email").value,
      document.getElementById("password").value
    );
  } catch (e) {
    alert("Login Failed: " + e.message);
  }
};

/* AUTH */
onAuthStateChanged(auth, (user) => {
  if (user) {
    loginBox.style.display = "none";
    adminPanel.style.display = "block";
  } else {
    loginBox.style.display = "block";
    adminPanel.style.display = "none";
  }
});

/* LOGOUT */
logoutBtn.onclick = () => signOut(auth);

/* SAVE / UPDATE */
async function save(){

  let name = document.getElementById("name").value.trim();
  let mode = document.getElementById("mode").value;
  let points = Number(document.getElementById("points").value);
  let region = document.getElementById("region").value || "AS";

  if(!name || !mode || isNaN(points)){
    alert("Fill all fields!");
    return;
  }

  let ref = doc(db,"players",name);
  let snap = await getDoc(ref);

  let data = snap.exists() ? snap.data() : { name, modes:{} };

  if(!data.modes) data.modes = {};

  data.modes[mode] = points;
  data.region = region;

  await setDoc(ref,data);

  alert("Saved / Updated!");
}

/* DELETE PLAYER */
async function deletePlayer(){

  let name = document.getElementById("name").value.trim();

  if(!name){
    alert("Enter player name");
    return;
  }

  if(!confirm("Delete player " + name + "?")) return;

  await deleteDoc(doc(db,"players",name));

  alert("Player deleted!");
}

/* DELETE MODE */
async function deleteMode(){

  let name = document.getElementById("name").value.trim();
  let mode = document.getElementById("mode").value;

  if(!name || !mode){
    alert("Enter player + mode");
    return;
  }

  if(!confirm(`Delete mode "${mode}" from ${name}?`)) return;

  await updateDoc(doc(db,"players",name), {
    [`modes.${mode}`]: deleteField()
  });

  alert("Mode deleted!");
}

/* SEASON */
let seasonId = Date.now();

async function startNewSeason(){

  if(!confirm("Start NEW SEASON?")) return;

  const snapshot = await getDocs(collection(db,"players"));

  for(let d of snapshot.docs){
    await setDoc(
      doc(db, `seasons/season_${seasonId}/players`, d.id),
      d.data()
    );
  }

  for(let d of snapshot.docs){
    await setDoc(doc(db,"players",d.id),{
      name: d.id,
      region: "AS",
      modes: {}
    });
  }

  seasonId++;
  alert("New Season Started!");
}

/* BUTTONS */
saveBtn.onclick = save;
deleteBtn.onclick = deletePlayer;
deleteModeBtn.onclick = deleteMode;
newSeasonBtn.onclick = startNewSeason;

/* LIST */
onSnapshot(collection(db,"players"), (snapshot)=>{

  let html = "";

  snapshot.forEach(docSnap=>{
    let p = docSnap.data();
    html += `<p data-name="${p.name}">${p.name}</p>`;
  });

  list.innerHTML = html;

  document.querySelectorAll("#list p").forEach(el=>{
    el.onclick = ()=> fill(el.dataset.name);
  });

});

/* AUTO FILL */
window.fill = async function(name){

  let snap = await getDoc(doc(db,"players",name));

  if(!snap.exists()) return;

  let p = snap.data();

  document.getElementById("name").value = p.name;
  document.getElementById("region").value = p.region || "";

  let keys = Object.keys(p.modes || {});
  if(keys.length){
    document.getElementById("mode").value = keys[0];
    document.getElementById("points").value = p.modes[keys[0]];
  }
};

</script>

</body>
</html>
