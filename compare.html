<!DOCTYPE html>
<html>
<head>
  <title>Compare Players</title>

  <style>
    body{
      margin:0;
      font-family:Segoe UI;
      background:#0b0b0b;
      color:white;
      padding:20px;
    }

    .container{
      max-width:1000px;
      margin:auto;
    }

    .top{
      display:flex;
      gap:10px;
      margin-bottom:5px;
      position:relative;
    }

    input{
      flex:1;
      padding:12px;
      background:#111;
      border:1px solid #222;
      color:white;
      border-radius:8px;
    }

    button{
      padding:12px 20px;
      background:#00ff99;
      border:none;
      border-radius:8px;
      cursor:pointer;
    }

    .suggest{
      position:absolute;
      top:50px;
      width:48%;
      background:#111;
      border:1px solid #222;
      border-radius:8px;
      max-height:200px;
      overflow-y:auto;
      z-index:100;
    }

    #suggest1{ left:0; }
    #suggest2{ right:0; }

    .item{
      padding:8px;
      display:flex;
      gap:8px;
      cursor:pointer;
      align-items:center;
    }

    .item:hover{ background:#1a1a1a; }

    .vs{
      text-align:center;
      margin:20px 0;
      font-size:22px;
      color:#00ff99;
    }

    .players{
      display:flex;
      gap:20px;
      margin-bottom:20px;
    }

    .card{
      flex:1;
      background:#111;
      padding:15px;
      border-radius:10px;
      text-align:center;
    }

    .card img{
      width:70px;
      border-radius:8px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:#111;
      border-radius:10px;
      overflow:hidden;
    }

    td{
      padding:12px;
      border-bottom:1px solid #222;
      text-align:center;
    }

    tr:hover{ background:#1a1a1a; }

    .win{ color:#00ff99; font-weight:bold; }
    .lose{ color:#ff4444; }
    .equal{ color:#aaa; }

    .winner{
      text-align:center;
      font-size:20px;
      padding:12px;
      color:#00ff99;
    }
  </style>
</head>

<body>

<div class="container">

<div class="top">
  <input id="p1" placeholder="Player 1">
  <input id="p2" placeholder="Player 2">
  <button onclick="compare()">Compare</button>

  <div id="suggest1" class="suggest"></div>
  <div id="suggest2" class="suggest"></div>
</div>

<div class="vs">VS</div>

<div class="players">
  <div class="card">
    <img id="skin1">
    <div id="name1"></div>
  </div>
  <div class="card">
    <img id="skin2">
    <div id="name2"></div>
  </div>
</div>

<table id="table"></table>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSy...",
  authDomain: "mc-tiers-ranking.firebaseapp.com",
  projectId: "mc-tiers-ranking",
});

const db = getFirestore(app);

let allPlayers = [];

/* LOAD PLAYERS FOR SUGGESTIONS */
onSnapshot(collection(db,"players"), snap=>{
  allPlayers = [];
  snap.forEach(d=>allPlayers.push(d.data()));
});

/* TIER */
function getTier(p){
  p = Number(p||0);
  if(p<5)return "-";
  if(p<20)return "LT5";
  if(p<40)return "HT5";
  if(p<70)return "LT4";
  if(p<100)return "HT4";
  if(p<140)return "LT3";
  if(p<180)return "HT3";
  if(p<220)return "LT2";
  if(p<260)return "HT2";
  if(p<300)return "LT1";
  return "HT1";
}

/* SUGGESTIONS */
function handleSuggest(input, box, target){
  let val = input.value.toLowerCase();
  if(!val){ box.innerHTML=""; return; }

  let match = allPlayers
    .filter(p=>p.name.toLowerCase().includes(val))
    .slice(0,5);

  box.innerHTML = match.map(p=>`
    <div class="item" onclick="selectPlayer('${p.name}','${target}')">
      <img src="https://mc-heads.net/avatar/${p.name}/24">
      ${p.name}
    </div>
  `).join("");
}

window.selectPlayer = function(name, target){
  document.getElementById(target).value = name;
  document.getElementById("suggest1").innerHTML="";
  document.getElementById("suggest2").innerHTML="";
};

document.getElementById("p1").oninput = e =>
  handleSuggest(e.target, document.getElementById("suggest1"), "p1");

document.getElementById("p2").oninput = e =>
  handleSuggest(e.target, document.getElementById("suggest2"), "p2");

/* COMPARE */
window.compare = async function(){

  let n1 = p1.value.trim();
  let n2 = p2.value.trim();

  if(!n1||!n2) return alert("Enter both players");

  name1.innerText = n1;
  name2.innerText = n2;

  skin1.src = `https://mc-heads.net/avatar/${n1}/100`;
  skin2.src = `https://mc-heads.net/avatar/${n2}/100`;

  let s1 = await getDoc(doc(db,"players",n1));
  let s2 = await getDoc(doc(db,"players",n2));

  let p1m = s1.exists()? s1.data().modes||{} : {};
  let p2m = s2.exists()? s2.data().modes||{} : {};

  let modes = new Set([...Object.keys(p1m), ...Object.keys(p2m)]);

  let total1=0,total2=0, rows="";

  modes.forEach(m=>{
    let v1=p1m[m]||0, v2=p2m[m]||0;
    total1+=v1; total2+=v2;

    let c1=v1>v2?"win":v1<v2?"lose":"equal";
    let c2=v2>v1?"win":v2<v1?"lose":"equal";

    rows+=`
      <tr>
        <td class="${c1}">${getTier(v1)} (${v1})</td>
        <td>
          <img src="https://mctiers.com/tier_icons/${m}.svg" width="20"><br>
          ${m.toUpperCase()}
        </td>
        <td class="${c2}">${getTier(v2)} (${v2})</td>
      </tr>`;
  });

  let winner =
    total1>total2?`${n1} WINS 🏆`:
    total2>total1?`${n2} WINS 🏆`:"DRAW";

  table.innerHTML = `
    <tr><td colspan="3" class="winner">${winner}</td></tr>
    ${rows}
    <tr>
      <td class="${total1>total2?"win":total1<total2?"lose":"equal"}">${total1}</td>
      <td><b>TOTAL</b></td>
      <td class="${total2>total1?"win":total2<total1?"lose":"equal"}">${total2}</td>
    </tr>`;
};
</script>

</body>
</html>
